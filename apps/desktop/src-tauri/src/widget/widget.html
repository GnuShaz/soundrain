<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>SoundRain — Сейчас играет</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }

      body {
        font-family:
          "Inter Tight",
          "Segoe UI",
          system-ui,
          sans-serif;
        color: #efe9dc;
      }

      #widget {
        display: none;
        align-items: center;
        gap: 14px;
        padding: 16px;
        width: fit-content;
      }

      #widget.visible {
        display: flex;
      }

      #cover {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        background: #1c1915;
        object-fit: cover;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
      }

      #meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      #brand {
        margin: 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e39b32;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }

      #title,
      #artist {
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 320px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }

      #title {
        font-size: 16px;
        font-weight: 600;
      }

      #artist {
        font-size: 13px;
        color: #cfc8b8;
      }

      #track {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #time-current,
      #time-total {
        font-family: "Geist Mono", "Consolas", monospace;
        font-size: 11px;
        color: #cfc8b8;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      }

      #bar {
        position: relative;
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.28);
      }

      #bar-fill {
        position: absolute;
        inset: 0;
        width: 0%;
        background: #e39b32;
        transition: width 0.9s linear;
      }
    </style>
  </head>
  <body>
    <div id="widget">
      <img id="cover" src="" alt="" />
      <div id="meta">
        <p id="brand">SoundRain</p>
        <p id="title"></p>
        <p id="artist"></p>
        <div id="track">
          <span id="time-current">0:00</span>
          <div id="bar"><div id="bar-fill"></div></div>
          <span id="time-total">0:00</span>
        </div>
      </div>
    </div>

    <script>
      const widgetEl = document.getElementById("widget");
      const coverEl = document.getElementById("cover");
      const titleEl = document.getElementById("title");
      const artistEl = document.getElementById("artist");
      const barFillEl = document.getElementById("bar-fill");
      const timeCurrentEl = document.getElementById("time-current");
      const timeTotalEl = document.getElementById("time-total");

      function formatSeconds(totalSecondsInput) {
        const totalSeconds = Math.max(0, Math.round(totalSecondsInput));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      async function poll() {
        try {
          const res = await fetch("/now-playing", { cache: "no-store" });
          const data = await res.json();

          if (!data) {
            widgetEl.classList.remove("visible");
            return;
          }

          widgetEl.classList.add("visible");
          if (coverEl.src !== data.coverUrl) coverEl.src = data.coverUrl ?? "";
          titleEl.textContent = data.title;
          artistEl.textContent = data.artist;
          timeCurrentEl.textContent = formatSeconds(data.positionSecs);
          timeTotalEl.textContent = formatSeconds(data.durationSecs);
          const fraction =
            data.durationSecs > 0
              ? Math.min(1, data.positionSecs / data.durationSecs)
              : 0;
          barFillEl.style.width = `${fraction * 100}%`;
        } catch {
          // Сервер ещё не поднялся/перезапускается — просто ждём следующий тик.
        }
      }

      poll();
      setInterval(poll, 1000);
    </script>
  </body>
</html>
