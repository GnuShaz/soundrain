services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soundrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soundrain
    volumes:
      - soundrain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundrain"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://soundrain:${POSTGRES_PASSWORD}@postgres:5432/soundrain
      PORT: 3001
      API_KEY: ${API_KEY}
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  soundrain_postgres_data:
